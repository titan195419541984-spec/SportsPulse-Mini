<script>
const SPORTS={nba:{label:"NBA",emoji:"🏀"},nfl:{label:"NFL",emoji:"🏈"},mlb:{label:"MLB",emoji:"⚾"},nhl:{label:"NHL",emoji:"🏒"},soccer:{label:"SOCCER",emoji:"⚽"},pga:{label:"PGA TOUR",emoji:"⛳"},wnba:{label:"WNBA",emoji:"🏀"},tennis:{label:"TENNIS",emoji:"🎾"}};
const app=document.getElementById("app");let selectedSport="all",boardCache={},refreshTimer=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function eventBits(e){const c=e.competitions?.[0]||{}, competitors=c.competitors||[],home=competitors.find(t=>t.homeAway==="home")||competitors[0]||{},away=competitors.find(t=>t.homeAway==="away")||competitors[1]||{};const st=e.status||c.status||{},type=st.type||{},detail=st.displayClock||type.detail||type.shortDetail||"SCHEDULED",live=!!type.state&&type.state==="in",completed=type.completed===true;return {id:e.id,home,away,competition:c,status:detail,live,completed,league:e.league?.name||"",date:e.date||c.date||"",venue:c.venue?.fullName||"",city:c.venue?.address?.city||"",broadcast:(c.broadcasts||[]).map(x=>x.names?.join(", ")).filter(Boolean).join(", ")||c.geoBroadcasts?.map(x=>x.media?.shortName).filter(Boolean).join(", ")||"",name:(away.team?.displayName||away.team?.name||"Away Team")+" at "+(home.team?.displayName||home.team?.name||"Home Team"),state:type.state||"pre"}}
function score(t){return t?.score??"—"}function teamName(t){return t?.team?.displayName||t?.team?.name||"Team"}function logo(t){return t?.team?.logo||t?.team?.logos?.[0]?.href||""}function record(t){const fmt=v=>{if(v==null)return"";if(typeof v==="string"||typeof v==="number")return String(v);if(Array.isArray(v))return v.map(fmt).filter(Boolean).join(" · ");if(typeof v==="object"){if(v.summary!=null)return fmt(v.summary);if(v.displayValue!=null)return fmt(v.displayValue);if(v.displayName!=null)return fmt(v.displayName);if(v.name!=null&&v.name!=="overall")return fmt(v.name);if(v.wins!=null&&v.losses!=null)return String(v.wins)+"-"+String(v.losses);if(v.value!=null)return fmt(v.value);return""}return""};return fmt(t?.records?.[0]?.summary)||fmt(t?.records?.[0])||fmt(t?.record)||fmt(t?.records)||""}

function gameCard(s,e){const b=eventBits(e),label=SPORTS[s]?.label||s.toUpperCase(),live=b.live,stat=b.completed?"FINAL":live?"LIVE · "+b.status:"UPCOMING";return '<a class="game-card" href="'+gameHref(s,b.id)+'"><div class="card-top"><span class="league">'+esc(label)+'</span><span class="live"><i class="dot"></i>'+esc(stat)+'</span></div>'+teamLine(b.away)+teamLine(b.home)+'<div class="card-footer"><span class="foot-item">♧ &nbsp;'+esc(b.venue||"Venue details unavailable")+'</span><span class="foot-item">▣ &nbsp;'+esc(b.broadcast||"Broadcast details vary by region")+'</span></div><div class="date-line">'+esc(dateLabel(b.date))+'</div></a>'}

async function getBoard(s){if(boardCache[s]&&Date.now()-boardCache[s].time<22000)return boardCache[s].data;const r=await fetch("/api/scoreboard/"+encodeURIComponent(s));if(!r.ok)throw new Error("Unable to load "+s+" scores");const data=await r.json();boardCache[s]={data,time:Date.now()};return data}

function statusPill(e){const c=e?.competitions?.[0]||{},t=(e?.status||c.status||{}).type||{};return '<span class="live"><i class="dot"></i>'+esc(t.completed?"FINAL":t.state==="in"?"LIVE · "+((e.status||c.status||{}).displayClock||t.detail||"IN PROGRESS"):t.detail||"UPCOMING")+'</span>'}
function detailsMarkup(s,id,data){let h=data.header||{},comp=h.competitions?.[0]||{},competitors=comp.competitors||[],away=competitors.find(x=>x.homeAway==="away")||competitors[0]||{},home=competitors.find(x=>x.homeAway==="home")||competitors[1]||{},event={...h,competitions:[comp]},b=eventBits(event),label=SPORTS[s]?.label||s.toUpperCase(),dt=dateLabel(b.date);
const leaderGroups=Array.isArray(data.leaders)?data.leaders:[];
const leaders=leaderGroups.flatMap(group=>(Array.isArray(group.leaders)?group.leaders:[]).map(p=>({...p,_group:group.displayName||group.name||""}))).filter(p=>p.athlete?.displayName||p.athlete?.shortName);
let playerHtml="";
if(leaders.length){playerHtml=leaders.slice(0,8).map(p=>'<div class="player-row"><span>'+esc(p.athlete?.displayName||p.athlete?.shortName)+(p._group?' <small style="color:var(--muted)">· '+esc(p._group)+'</small>':"")+'</span><b>'+esc(p.displayValue??p.value??"")+'</b></div>').join("")}
if(!playerHtml){const teams=Array.isArray(data.boxscore?.players)?data.boxscore.players:[];const stats=[];for(const team of teams){for(const category of (team.statistics||[])){const athletes=Array.isArray(category.athletes)?category.athletes:[];for(const row of athletes){const athlete=row.athlete||{};const values=Array.isArray(row.stats)?row.stats:[];if(!athlete.displayName||!values.length)continue;const labels=Array.isArray(category.labels)?category.labels:[];const preferred=labels.map((name,i)=>({name,value:values[i]})).filter(x=>x.value!==undefined&&x.value!==""&&x.value!=="0").slice(0,2);if(preferred.length)stats.push({name:athlete.displayName,team:team.team?.displayName||"",category:category.name||category.displayName||"Stats",value:preferred.map(x=>x.name+": "+x.value).join(" · ")})}}}playerHtml=stats.slice(0,8).map(p=>'<div class="player-row"><span>'+esc(p.name)+' <small style="color:var(--muted)">· '+esc(p.team)+' / '+esc(p.category)+'</small></span><b>'+esc(p.value)+'</b></div>').join("")}
if(!playerHtml)playerHtml='<p>Player statistics have not been published for this matchup yet. Check back when the official game feed provides individual stats.</p>';
return '<section class="hero"><div class="wrap hero-inner"><div class="tags"><span class="tag-gold">HEADLINE EVENT</span><span class="league">'+esc(label)+'</span>'+statusPill(event)+'</div><h1>'+esc(b.name)+'</h1><div class="hero-meta">'+esc(dt)+' · '+esc(b.venue||"VENUE TBA")+(b.broadcast?' · WATCH ON '+esc(b.broadcast):"")+'</div><div class="hero-teams">'+heroTeam(away)+heroTeam(home)+'</div><div class="tags">'+statusPill(event)+' <span class="kicker" style="font-size:14px">ESPN LIVE FEED</span></div><div class="hero-actions"><button class="pill big" id="updates">GET LIVE MATCH UPDATES</button><a class="outline" href="#full-matchup">FULL MATCHUP</a></div><div class="socials"><button aria-label="Share" id="share">⌯</button><button aria-label="Share to X" id="share-x">X</button><button aria-label="Facebook share" id="share-f">f</button><button aria-label="Copy direct link" id="copy-link">▢</button></div><p id="share-message" class="record" role="status"></p></div></section><div class="wrap detail-grid" id="full-matchup"><section class="panel"><h2>MATCHUP READ</h2><p>'+esc(b.name)+' · '+esc(b.status)+'. Scores and game status are provided by ESPN. This page refreshes periodically.</p><div class="player-row"><span>Venue</span><b>'+esc(b.venue||"TBA")+'</b></div><div class="player-row"><span>Broadcast</span><b>'+esc(b.broadcast||"TBA")+'</b></div><div class="player-row"><span>Start time</span><b>'+esc(dt)+'</b></div></section><section class="panel"><h2>KEY PLAYERS / LEADERS</h2>'+playerHtml+'</section><section class="panel"><h2>FAN PICKS</h2><p>Choose the team you think will win. Your selection stays on this device. This is a local demo and is not counted as a server-wide poll.</p><div class="player-row"><button class="outline" data-pick="away">'+esc(teamName(away))+'</button><button class="outline" data-pick="home">'+esc(teamName(home))+'</button></div><p id="pick-message" role="status"></p></section><section class="panel"><h2>LIVE GAME DATA</h2><p>Data source: ESPN function heroTeam(t){const l=logo(t);return '<div class="hero-team"><div class="logo">'+(l?'<img alt="" src="'+esc(l)+'" style="width:100%;height:100%;object-fit:contain">':"🏟")+'</div><div><div class="team-name">'+esc(teamName(t))+'</div><div class="record">'+esc(record(t))+'</div></div><div class="score">'+esc(score(t))+'</div></div>'}
async function renderGame(s,id){setActive(s);app.innerHTML='<div class="wrap"><div class="loading">LOADING MATCHUP…</div></div>';try{const r=await fetch('/api/game/'+encodeURIComponent(s)+'/'+encodeURIComponent(id));if(!r.ok)throw new Error("This game is not available from the live feed.");const data=await r.json();if(!data.header)throw new Error("The feed returned no game header.");document.title=(data.header.competitions?.[0]?.competitors||[]).map(x=>x.team?.displayName).filter(Boolean).join(" at ")+" | The Arena";app.innerHTML=detailsMarkup(s,id,data);wireGame(s,id); }catch(e){app.innerHTML='<div class="wrap"><div class="section-head"><div><div class="kicker">MATCHUP</div><h1>GAME DETAILS</h1></div></div><div class="error">'+esc(e.message)+'<p><a class="pill" href="/scores">BACK TO LIVE SCORES</a></p></div></div>'}}
function wireGame(s,id){const msg=document.getElementById("share-message");document.getElementById("updates")?.addEventListener("click",()=>{msg.textContent="Live updates are enabled while this page is open.";window.scrollTo({top:0,behavior:"smooth"});});document.getElementById("refresh-game")?.addEventListener("click",()=>renderGame(s,id));document.getElementById("copy-link")?.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(location.href);msg.textContent="Direct game link copied."}catch{msg.textContent=location.href}});document.getElementById("share")?.addEventListener("click",async()=>{if(navigator.share){try{await navigator.share({title:document.title,url:location.href})}catch{}}else{try{await navigator.clipboard.writeText(location.href);msg.textContent="Direct game link copied."}catch{msg.textContent=location.href}}});document.getElementById("share-x")?.addEventListener("click",()=>window.open("https://twitter.com/intent/tweet?url="+encodeURIComponent(location.href)+"&text="+encodeURIComponent(document.title),"_blank","noopener,noreferrer"));document.getElementById("share-f")?.addEventListener("click",()=>window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(location.href),"_blank","noopener,noreferrer"));document.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{localStorage.setItem("arena-pick-"+s+"-"+id,b.dataset.pick);document.getElementById("pick-message").textContent="Your pick is saved on this device.";}));}
document.querySelectorAll("[data-sport]").forEach(b=>b.addEventListener("click",()=>{selectedSport=b.dataset.sport;history.pushState({}, "",selectedSport==="all"?"/scores":"/scores?sport="+selectedSport);renderScores().catch(showError)}));

nba.com/watch/featured" target="_blank" rel="noopener noreferrer">Watch NBA videos ↗</a></article></div><p class="highlight-note"><strong style="color:var(--white)">About video playback:</strong> Official publishers control which clips can be embedded and where they are available. This first version links directly to authorized source pages rather than rehosting clips. We can add individual embedded players when the publisher provides an embeddable video URL. Ads remain outside video playback.</p><a class="outline" href="/scores" id="back-to-scores">← Back to live scores</a></div>';
document.getElementById("back-to-scores")?.addEventListener("click",e=>{e.preventDefault();selectedSport="all";history.pushState({},"","/scores");renderScores().catch(showError)});

function showError(e){app.innerHTML='<div class="wrap"><div class="error">'+esc(e.message||"Unable to load live scores.")+'</div></div>'}
function route(){if(new URLSearchParams(location.search).get("view")==="highlights"){renderHighlights();return}const p=location.pathname.match(/^\/game\/([a-z0-9.-]+)\/([0-9]+)\/?$/i);if(p){renderGame(p[1].toLowerCase(),p[2]);return}const q=new URLSearchParams(location.search);selectedSport=q.get("sport")||"all";renderScores().catch(showError)}
window.addEventListener("popstate",route);route();setInterval(()=>{boardCache={};if(!location.pathname.startsWith("/game/"))renderScores().catch(()=>{});else{const p=location.pathname.match(/^\/game\/([a-z0-9.-]+)\/([0-9]+)\/?$/i);if(p)renderGame(p[1],p[2])}},30000);
</script>
